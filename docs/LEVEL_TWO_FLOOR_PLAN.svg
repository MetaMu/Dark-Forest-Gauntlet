<g font-family="Arial" fill="#e9e5ce" transform="translate(565 115)">
<text y="0" font-size="22">Three routes, one objective</text>
<text y="35" font-size="16">West: flank the nursery</text><text y="59" font-size="13" fill="#acd0bd">Long wall breaks sightlines.</text>
<text y="103" font-size="16">Center: shortest, most exposed</text><text y="127" font-size="13" fill="#acd0bd">Split around the raised court.</text>
<text y="171" font-size="16">East: Mortarcap pressure</text><text y="195" font-size="13" fill="#acd0bd">Use cover, then move between blasts.</text>
<text y="245" font-size="20">Enemy placement</text>
<text y="276" font-size="15" fill="#de93bd">A — Cistern Anchor · 150 HP</text>
<text y="306" font-size="15" fill="#badb69">M — Mortarcap · ranged area denial</text>
<text y="336" font-size="15" fill="#a8c9c1">Square — Ironroot Guard · 90 HP</text>
<text y="366" font-size="15" fill="#e6c996">Dot — Hardened Rootling · 42 HP</text>
<text y="408" font-size="13">First anchor destroyed: one reinforcement pair.</text>
<text y="432" font-size="13">Clear all enemies → collect pear → north gate.</text>
